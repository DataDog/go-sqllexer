name: Harness throughput matrix

# Cross-platform performance evidence for the Rust migration harness. The ratios in
# harness/ACCEPTANCE.md section C were measured on a single x86_64 cloud VM; this
# workflow re-measures them on the dedicated arm-8core-linux runner (the agreed
# arbiter) and, informationally, on a shared ubuntu-latest runner.
#
# It never touches the library build: everything lives under harness/ and rust/.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Measured duration per configuration
        default: 60s
      warmup:
        description: Warmup per configuration
        default: 10s
      repeats:
        description: How many times to run the whole matrix
        default: "3"
  push:
    branches:
      - "devin/**-cross-platform-perf"

concurrency:
  group: harness-throughput-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm:
    name: arm-8core-linux (dedicated)
    runs-on:
      group: ARM LINUX SHARED
      labels: arm-8core-linux
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version: '1.25.7'
      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Environment
        run: |
          go version
          cargo --version && rustc --version --verbose
          uname -a
          nproc
          getconf PAGESIZE
          lscpu || cat /proc/cpuinfo
          free -g || true
      - name: Build Rust workspace
        run: cargo build --release --workspace
        working-directory: rust
      - name: Generate corpora
        run: go run ./harness/cmd/corpusgen -out harness/corpus
      - name: Sanity check the cgo binding on this architecture
        run: |
          go vet -tags rustffi ./harness/...
          go test -a -tags rustffi -count=1 ./harness/...
      - name: Run the report matrix
        env:
          DURATION: ${{ github.event.inputs.duration || '60s' }}
          WARMUP: ${{ github.event.inputs.warmup || '10s' }}
          REPEATS: ${{ github.event.inputs.repeats || '3' }}
        run: |
          for i in $(seq 1 "$REPEATS"); do
            OUT="harness/reports/ci-arm/run$i" harness/reports/run.sh
          done
      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-ci-arm
          path: harness/reports/ci-arm

  x86:
    # Informational only: ubuntu-latest is a shared 4-vCPU runner, so absolute
    # throughput and tail latency there are noise-dominated. It is here as a
    # second architecture-independent data point for the Rust/Go ratios.
    name: ubuntu-latest (shared, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version: '1.25.7'
      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Environment
        run: |
          go version
          cargo --version && rustc --version --verbose
          uname -a
          nproc
          getconf PAGESIZE
          lscpu || cat /proc/cpuinfo
          free -g || true
      - name: Build Rust workspace
        run: cargo build --release --workspace
        working-directory: rust
      - name: Generate corpora
        run: go run ./harness/cmd/corpusgen -out harness/corpus
      - name: Run the report matrix
        env:
          DURATION: ${{ github.event.inputs.duration || '60s' }}
          WARMUP: ${{ github.event.inputs.warmup || '10s' }}
          REPEATS: ${{ github.event.inputs.repeats || '3' }}
        run: |
          for i in $(seq 1 "$REPEATS"); do
            OUT="harness/reports/ci-x86/run$i" harness/reports/run.sh
          done
      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-ci-x86
          path: harness/reports/ci-x86
