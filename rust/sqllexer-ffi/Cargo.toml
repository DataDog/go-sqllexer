[package]
name = "sqllexer-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "C ABI for the Rust sqllexer, consumed from Go through cgo"

[lib]
name = "sqllexer_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Exports sqllexer_panic_probe, an entry point that panics on purpose so hosts
# can test panic containment. Never enabled for a shipped build.
panic-probe = []

[dependencies]
sqllexer = { path = "../sqllexer" }
