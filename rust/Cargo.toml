[workspace]
resolver = "2"
members = ["sqllexer", "sqllexer-ffi", "sqllexer-runner"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding stays enabled: the FFI layer catches panics at the boundary and
# reports them as errors, which is safer inside a host process than aborting it.
panic = "unwind"
